<!DOCTYPE html>
<html>

<head>
    <title>Metallic&Roughness</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
    </style>
</head>

<body>

    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/EXRLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dat.gui@0.7.9/build/dat.gui.min.js"></script>

    <script>
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;

        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;

        document.body.appendChild(renderer.domElement);

        const scene = new THREE.Scene();

       
        const exrSkyboxUrl = 'https://pawarisam3.github.io/cowboy_town_saloon_1k.exr';
        const pmremGenerator = new THREE.PMREMGenerator(renderer);
        pmremGenerator.compileEquirectangularShader();

        new THREE.EXRLoader()
            .setDataType(THREE.UnsignedByteType)
            .load(exrSkyboxUrl, (texture) => {
                const skybox = pmremGenerator.fromEquirectangular(texture).texture;
                
                scene.background = skybox;
                scene.environment = skybox;

                texture.dispose();
                pmremGenerator.dispose();
                console.log('EXR Skybox loaded successfully!');
            }, undefined, (error) => {
                console.error('Unable to load EXR skybox:', error);
            });

        // กล้อง
        const camera = new THREE.PerspectiveCamera(
            35,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );
        camera.position.set(0, 2, 5);
        camera.lookAt(0, 0, 0);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);

        // GUI
        const gui = new dat.GUI();
        const materialSettings = {
    metalness: 0.0,
    roughness: 0.5
};

gui.add(
    materialSettings,
    'metalness',
    0,
    1
)
.step(0.01)
.name('Metallic')
.onChange(function(value) {

    if (!model) return;

    model.traverse(function(child) {

        if (!child.isMesh) return;

        const materials = Array.isArray(child.material)
            ? child.material
            : [child.material];

        materials.forEach(function(material) {

            if (material && 'metalness' in material) {
                material.metalness = value;
                material.needsUpdate = true;
            }

        });

    });

});


gui.add(
    materialSettings,
    'roughness',
    0,
    1
)
.step(0.01)
.name('Roughness')
.onChange(function(value) {

    if (!model) return;

    model.traverse(function(child) {

        if (!child.isMesh) return;

        const materials = Array.isArray(child.material)
            ? child.material
            : [child.material];

        materials.forEach(function(material) {

            if (material && 'roughness' in material) {
                material.roughness = value;
                material.needsUpdate = true;
            }

        });

    });

});


        let model = null;
        const gltfLoader = new THREE.GLTFLoader();
        gltfLoader.load('https://pawarisadara.github.io/simple_cola_can.glb', function (gltf) {
            model = gltf.scene;
            model.scale.set(0.5, 0.5, 0.5);
            model.position.set(0.0,0.8,0.0)
            model.traverse(function (child) {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                }
            });
            scene.add(model);
        });

        // Floor
        const texFloor = new THREE.TextureLoader().load('https://pawarisam3.github.io/kitchen_wood_diff_1k.jpg', t => {
            t.wrapS = THREE.RepeatWrapping;
            t.wrapT = THREE.RepeatWrapping;
            t.encoding = THREE.sRGBEncoding;
        });

        const matFloor = new THREE.MeshStandardMaterial({
            map: texFloor
        });
        const planeGeometry = new THREE.PlaneGeometry(3, 3);
        const plane = new THREE.Mesh(planeGeometry, matFloor);
        plane.rotation.x = -Math.PI / 2;
        plane.receiveShadow = true;
        scene.add(plane);

        
        function animate(t) {
            controls.update();
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        animate(0);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>

</html>
